name: Bug report / 问题反馈
description: Report a reproducible issue without private data / 请勿包含私人数据
body:
  - type: markdown
    attributes:
      value: Never attach tokens, keys, native credentials, config files, databases or full logs. 不要上传令牌、密钥、凭据、配置、数据库或完整日志。
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected behavior / 复现步骤与预期
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: OS, Python, Lazyfish and Codex versions / 版本
    validations:
      required: true
