name: Bug report
description: Report a reproducible issue without private data
body:
  - type: markdown
    attributes:
      value: Never attach tokens, keys, native credentials, config files, databases or full logs.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected behavior
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: OS, Python, Lazyfish and Codex versions
    validations:
      required: true
