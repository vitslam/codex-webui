name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Private build and test directories
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/lazyfish/tmp" "$RUNNER_TEMP/lazyfish/dist"
          echo "TMPDIR=$RUNNER_TEMP/lazyfish/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP/lazyfish/tmp" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP/lazyfish/tmp" >> "$GITHUB_ENV"
      - run: python -m pip install . build
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/install.sh
      - run: for file in src/lazyfish/web/static/*.js tests/*.cjs; do node --check "$file"; done
      - run: python -m build --outdir "$RUNNER_TEMP/lazyfish/dist"
      - name: Install wheel outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/lazyfish/installed"
          "$RUNNER_TEMP/lazyfish/installed/bin/python" -m pip install --no-index "$RUNNER_TEMP"/lazyfish/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/lazyfish/installed/bin/lazyfish" --version
          "$RUNNER_TEMP/lazyfish/installed/bin/python" -c "from importlib.resources import files; assert files('lazyfish.web').joinpath('static/index.html').is_file()"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated browser dependencies and fake service
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/lazyfish-browser/tmp" "$RUNNER_TEMP/lazyfish-browser/output"
          export TMPDIR="$RUNNER_TEMP/lazyfish-browser/tmp" TEMP="$RUNNER_TEMP/lazyfish-browser/tmp" TMP="$RUNNER_TEMP/lazyfish-browser/tmp"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/lazyfish-browser/browsers"
          npm install --prefix "$RUNNER_TEMP/lazyfish-browser" --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/lazyfish-browser/node_modules/.bin/playwright" install --with-deps chromium
          python -m pip install .
          export LAZYFISH_BROWSER_NODE="$(command -v node)"
          export LAZYFISH_BROWSER_MODULE="$RUNNER_TEMP/lazyfish-browser/node_modules/playwright"
          export LAZYFISH_BROWSER_EXECUTABLE="$(node -e 'console.log(require(process.env.LAZYFISH_BROWSER_MODULE).chromium.executablePath())')"
          export LAZYFISH_BROWSER_OUTPUT="$RUNNER_TEMP/lazyfish-browser/output"
          python -m unittest discover -s tests -p test_browser.py -v 2>&1 | tee "$LAZYFISH_BROWSER_OUTPUT/unittest.log"
      - name: Report browser failure details
        if: failure()
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'lazyfish-browser/output/unittest.log'
          if log.is_file():
              text = log.read_text(errors='replace')[-24000:]
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Browser regression details::' + text)
          PYTHON
